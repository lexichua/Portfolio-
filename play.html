<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play — Lexi Chua</title>
  <meta name="description" content="Playground and creative works by Lexi Chua, including illustration, graphic design, games, and music.">
  
  <!-- Google Fonts: Figtree, Outfit, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body class="play-page">

  <!-- Custom Morphing Cursor Element -->
  <div id="custom-cursor" class="custom-cursor" aria-hidden="true">
    <div class="custom-cursor-shape"></div>
  </div>

  <!-- Subtle Top & Bottom Viewport Edge Fades -->
  <div class="viewport-fade-top" aria-hidden="true"></div>
  <div class="viewport-fade-bottom" aria-hidden="true"></div>

  <!-- Top Floating Navigation Bar (Universal across site) -->
  <div class="top-header-wrapper" id="top-nav-wrapper">
    <nav class="floating-nav" id="floating-nav" aria-label="Main Navigation">
      <div class="nav-wing nav-wing-left">
        <a href="index.html" class="nav-pill">Work</a>
        <a href="play.html" class="nav-pill active">Play</a>
      </div>

      <a href="index.html" class="nav-logo-box" id="nav-logo-box" aria-label="Return to home page">
        <img src="assets/logo_union.svg" id="nav-logo-img" alt="Lexi Chua Logo" width="40" height="40">
      </a>

      <div class="nav-wing nav-wing-right">
        <a href="index.html#about" class="nav-pill">About</a>
        <a href="https://drive.google.com/file/d/1Vvf6IKBH4ZEHBFksC2GzY-p0pDCKIhQ1/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="nav-pill">Resume</a>
      </div>
    </nav>
  </div>

  <div class="page-container play-page-container">

    <!-- Main Play Content -->
    <main class="play-article">
      
      <!-- Page Header -->
      <header class="play-header reveal-chunk">
        <h1 class="play-title">Play</h1>
        
        <!-- Category Filter Tags -->
        <nav class="play-tag-bar" aria-label="Play categories">
          <button type="button" class="play-tag active" data-target="illustration">Illustration</button>
          <button type="button" class="play-tag" data-target="graphic-design">Graphic Design</button>
          <button type="button" class="play-tag" data-target="games">Games</button>
          <button type="button" class="play-tag" data-target="music">Music</button>
        </nav>
      </header>

      <!-- SECTION 1: ILLUSTRATION -->
      <section class="play-section play-section-active" id="illustration-section">
        <div class="illustration-grid reveal-chunk">
          <div class="illustration-row top-row">
            <div class="media-card card-uclaeg">
              <img src="assets/play/illustration_uclaeg_pokemon.png" alt="UCLA Esports & Gaming Pokemon Illustration">
            </div>
            <div class="media-card card-splatoon">
              <img src="assets/play/illustration_splatoon_inkling.png" alt="Splatoon Inkling Illustration">
            </div>
          </div>
          
          <div class="illustration-row bottom-row">
            <div class="media-card card-ganyu">
              <img src="assets/play/illustration_ganyu_raft.png" alt="Ganyu on raft illustration">
            </div>
            <div class="media-card card-shinobu">
              <img src="assets/play/illustration_shinobu_butterfly.png" alt="Shinobu butterfly illustration">
            </div>
            <div class="media-card card-icecream">
              <img src="assets/play/illustration_icecream_dessert.png" alt="Ice cream dessert illustration">
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: GRAPHIC DESIGN -->
      <section class="play-section" id="graphic-design-section">
        <div class="graphic-design-grid reveal-chunk">
          <!-- Row 1: 4 Posters -->
          <div class="design-posters-row">
            <div class="media-card poster-card">
              <img src="assets/play/design_tetris_reveal.png" alt="Tetris Roster Reveal Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_ucla_giveaway.png" alt="UCLA Esports Giveaway Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_marvel_rivals.png" alt="Marvel Rivals Roster Reveal Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_sopha_mopha_birthday.png" alt="Sopha Mopha Birthday Poster">
            </div>
          </div>

          <!-- Row 2: 3 Food Stickers/Badges -->
          <div class="design-badges-row">
            <div class="badge-item badge-feast">
              <img src="assets/play/design_feast_street.png" alt="Feast Street Badge">
            </div>
            <div class="badge-item badge-gelato">
              <img src="assets/play/design_1919_gelato.png" alt="1919 Tasty Gelato Badge">
            </div>
            <div class="badge-item badge-funnel">
              <img src="assets/play/design_deneve_funnel_cakes.png" alt="De Neve Funnel Cakes Badge">
            </div>
          </div>

          <!-- Row 3: Boardwalk Logo Badge -->
          <div class="design-center-badge">
            <div class="badge-item badge-boardwalk">
              <img src="assets/play/design_bruin_boardwalk.png" alt="Bruin Boardwalk Logo">
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 3: GAMES -->
      <section class="play-section" id="games-section">
        <div class="games-grid reveal-chunk">
          <a href="https://play.unity.com/en/games/0096e940-e66b-436f-a2c1-3ff41c4ca77c/swimmy-whale" target="_blank" rel="noopener noreferrer" class="game-card-link" aria-label="Play Swimmy Whale on Unity (opens in new tab)">
            <div class="game-card-media">
              <img src="assets/play/game_swimmy_whale_screen.png" alt="Swimmy Whale Unity Game Preview">
              <div class="game-play-overlay">
                <span class="game-play-badge">Play Game ↗</span>
              </div>
            </div>
          </a>
        </div>
      </section>

      <!-- SECTION 4: MUSIC -->
      <section class="play-section" id="music-section">
        <div class="music-container reveal-chunk">
          <p class="music-subtitle">A collection of music for a Game Jam I was in</p>
          
          <div class="music-grid">
            <!-- Row 1: 3 tracks -->
            <div class="music-track-card">
              <div class="music-track-cover">
                <img src="assets/play/music_fond_memories.png" alt="Fond Memories cover art">
              </div>
              <h3 class="music-track-title">Fond Memories</h3>
            </div>

            <div class="music-track-card">
              <div class="music-track-cover">
                <img src="assets/play/music_dragon.png" alt="Dragon.? cover art">
              </div>
              <h3 class="music-track-title">Dragon.?</h3>
            </div>

            <div class="music-track-card">
              <div class="music-track-cover">
                <img src="assets/play/music_weewoo.png" alt="Weewoo cover art">
              </div>
              <h3 class="music-track-title">Weewoo</h3>
            </div>

            <!-- Row 2: 2 tracks -->
            <div class="music-track-card">
              <div class="music-track-cover">
                <img src="assets/play/music_deepspace.png" alt="Deepspace cover art">
              </div>
              <h3 class="music-track-title">Deepspace</h3>
            </div>

            <div class="music-track-card">
              <div class="music-track-cover">
                <img src="assets/play/music_you_tried.png" alt="You tried cover art">
              </div>
              <h3 class="music-track-title">You tried</h3>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
