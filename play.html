<!DOCTYPE html>
<html lang="en">

<body class="play-page">

  <!-- Custom Morphing Cursor Element -->
  <div id="custom-cursor" class="custom-cursor" aria-hidden="true">
    <div class="custom-cursor-shape"></div>
  </div>

  <!-- Subtle Top & Bottom Viewport Edge Fades -->
  <div class="viewport-fade-top" aria-hidden="true"></div>
  <div class="viewport-fade-bottom" aria-hidden="true"></div>

  <!-- Top Floating Navigation Bar (Universal across site) -->
  <div class="top-header-wrapper" id="top-nav-wrapper">
    <nav class="floating-nav" id="floating-nav" aria-label="Main Navigation">
      <div class="nav-wing nav-wing-left">
        <a href="index.html" class="nav-pill">Work</a>
        <a href="play.html" class="nav-pill active">Play</a>
      </div>

      <a href="index.html" class="nav-logo-box" id="nav-logo-box" aria-label="Return to home page">
        <img src="assets/logo_union.svg" id="nav-logo-img" alt="Lexi Chua Logo" width="40" height="40">
      </a>

      <div class="nav-wing nav-wing-right">
        <a href="about.html" class="nav-pill">About</a>
        <a href="https://drive.google.com/file/d/10KdwpGgJ-M44zvtkTwDR2CIg0nxfM8D4/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="nav-pill">Resume</a>
      </div>
    </nav>
  </div>

  <!-- Site Main Content Wrapper (Slides up to reveal footer underneath) -->
  <div class="site-main-wrapper">
    <div class="page-container play-page-container">

    <!-- Main Play Content -->
    <main class="play-article">
      
      <!-- Page Header -->
      <header class="play-header reveal-chunk">
        <h1 class="play-title">Play</h1>
        
        <!-- Category Filter Tags -->
        <nav class="play-tag-bar" aria-label="Play categories">
          <button type="button" class="play-tag active" data-target="illustration">Illustration</button>
          <button type="button" class="play-tag" data-target="graphic-design">Graphic Design</button>
          <button type="button" class="play-tag" data-target="games">Games</button>
          <button type="button" class="play-tag" data-target="music">Music</button>
        </nav>
      </header>

      <!-- SECTION 1: ILLUSTRATION -->
      <section class="play-section play-section-active" id="illustration-section">
        <div class="illustration-grid reveal-chunk">
          <div class="illustration-row top-row">
            <div class="media-card card-uclaeg">
              <img src="assets/play/illustration_uclaeg_pokemon.png" alt="UCLA Esports & Gaming Pokemon Illustration">
            </div>
            <div class="media-card card-splatoon">
              <img src="assets/play/illustration_splatoon_inkling.png" alt="Splatoon Inkling Illustration">
            </div>
          </div>
          
          <div class="illustration-row bottom-row">
            <div class="media-card card-ganyu">
              <img src="assets/play/illustration_ganyu_raft.png" alt="Ganyu on raft illustration">
            </div>
            <div class="media-card card-shinobu">
              <img src="assets/play/illustration_shinobu_butterfly.png" alt="Shinobu butterfly illustration">
            </div>
            <div class="media-card card-icecream">
              <img src="assets/play/illustration_icecream_dessert.png" alt="Ice cream dessert illustration">
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: GRAPHIC DESIGN -->
      <section class="play-section" id="graphic-design-section">
        <div class="graphic-design-grid reveal-chunk">
          <!-- Row 1: 4 Posters -->
          <div class="design-posters-row">
            <div class="media-card poster-card">
              <img src="assets/play/design_tetris_reveal.png" alt="Tetris Roster Reveal Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_ucla_giveaway.png" alt="UCLA Esports Giveaway Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_marvel_rivals.png" alt="Marvel Rivals Roster Reveal Poster">
            </div>
            <div class="media-card poster-card">
              <img src="assets/play/design_sopha_mopha_birthday.png" alt="Sopha Mopha Birthday Poster">
            </div>
          </div>

          <!-- Row 2: 3 Food Stickers/Badges -->
          <div class="design-badges-row">
            <div class="badge-item badge-feast">
              <img src="assets/play/design_feast_street.png" alt="Feast Street Badge">
            </div>
            <div class="badge-item badge-gelato">
              <img src="assets/play/design_1919_gelato.png" alt="1919 Tasty Gelato Badge">
            </div>
            <div class="badge-item badge-funnel">
              <img src="assets/play/design_deneve_funnel_cakes.png" alt="De Neve Funnel Cakes Badge">
            </div>
          </div>

          <!-- Row 3: Boardwalk Logo Badge -->
          <div class="design-center-badge">
            <div class="badge-item badge-boardwalk">
              <img src="assets/play/design_bruin_boardwalk.png" alt="Bruin Boardwalk Logo">
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 3: GAMES -->
      <section class="play-section" id="games-section">
        <div class="games-grid reveal-chunk">
          <a href="https://play.unity.com/api/v1/games/game/0096e940-e66b-436f-a2c1-3ff41c4ca77c/build/latest/frame" target="_blank" rel="noopener noreferrer" class="game-card-link" aria-label="Play Swimmy Whale on Unity (opens in new tab)">
            <div class="game-card-media">
              <img src="assets/play/game_swimmy_whale_screen.png" alt="Swimmy Whale Unity Game Preview">
              <div class="game-play-overlay">
                <span class="game-play-badge">Play Game ↗</span>
              </div>
            </div>
          </a>
        </div>
      </section>

      <!-- SECTION 4: MUSIC -->
      <section class="play-section" id="music-section">
        <div class="music-container reveal-chunk">
          <p class="music-subtitle">A collection of music for a Game Jam I was in</p>
          
          <div class="music-grid">
            <!-- Track 1: Fond Memories -->
            <div class="music-track-card" data-track-id="fond-memories">
              <div class="music-track-cover">
                <img src="assets/play/music_fond_memories.png" alt="Fond Memories cover art">
                <div class="music-play-overlay">
                  <button type="button" class="music-play-btn" aria-label="Play Fond Memories">
                    <svg class="play-icon" viewBox="0 0 24 24" width="22" height="22"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
                  </button>
                </div>
                <div class="music-wave-badge" aria-hidden="true">
                  <span class="bar bar-1"></span>
                  <span class="bar bar-2"></span>
                  <span class="bar bar-3"></span>
                </div>
              </div>
              <div class="music-track-meta">
                <div class="music-track-header">
                  <h3 class="music-track-title">Fond Memories</h3>
                  <span class="music-track-time">1:13</span>
                </div>
                <div class="music-progress-wrapper" role="slider" aria-label="Progress for Fond Memories" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                  <div class="music-progress-bar">
                    <div class="music-progress-fill"></div>
                  </div>
                </div>
              </div>
              <audio preload="metadata">
                <source src="assets/audio/fond_memories.m4a" type="audio/mp4">
                <source src="assets/audio/fond_memories.wav" type="audio/wav">
              </audio>
            </div>

            <!-- Track 2: Dragon.? -->
            <div class="music-track-card" data-track-id="dragon">
              <div class="music-track-cover">
                <img src="assets/play/music_dragon.png" alt="Dragon.? cover art">
                <div class="music-play-overlay">
                  <button type="button" class="music-play-btn" aria-label="Play Dragon.?">
                    <svg class="play-icon" viewBox="0 0 24 24" width="22" height="22"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
                  </button>
                </div>
                <div class="music-wave-badge" aria-hidden="true">
                  <span class="bar bar-1"></span>
                  <span class="bar bar-2"></span>
                  <span class="bar bar-3"></span>
                </div>
              </div>
              <div class="music-track-meta">
                <div class="music-track-header">
                  <h3 class="music-track-title">Dragon.?</h3>
                  <span class="music-track-time">1:11</span>
                </div>
                <div class="music-progress-wrapper" role="slider" aria-label="Progress for Dragon.?" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                  <div class="music-progress-bar">
                    <div class="music-progress-fill"></div>
                  </div>
                </div>
              </div>
              <audio preload="metadata">
                <source src="assets/audio/dragon.m4a" type="audio/mp4">
                <source src="assets/audio/dragon.wav" type="audio/wav">
              </audio>
            </div>

            <!-- Track 3: Weewoo -->
            <div class="music-track-card" data-track-id="weewoo">
              <div class="music-track-cover">
                <img src="assets/play/music_weewoo.png" alt="Weewoo cover art">
                <div class="music-play-overlay">
                  <button type="button" class="music-play-btn" aria-label="Play Weewoo">
                    <svg class="play-icon" viewBox="0 0 24 24" width="22" height="22"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
                  </button>
                </div>
                <div class="music-wave-badge" aria-hidden="true">
                  <span class="bar bar-1"></span>
                  <span class="bar bar-2"></span>
                  <span class="bar bar-3"></span>
                </div>
              </div>
              <div class="music-track-meta">
                <div class="music-track-header">
                  <h3 class="music-track-title">Weewoo</h3>
                  <span class="music-track-time">1:34</span>
                </div>
                <div class="music-progress-wrapper" role="slider" aria-label="Progress for Weewoo" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                  <div class="music-progress-bar">
                    <div class="music-progress-fill"></div>
                  </div>
                </div>
              </div>
              <audio preload="metadata">
                <source src="assets/audio/weewoo.m4a" type="audio/mp4">
                <source src="assets/audio/weewoo.wav" type="audio/wav">
              </audio>
            </div>

            <!-- Track 4: Deepspace -->
            <div class="music-track-card" data-track-id="deepspace">
              <div class="music-track-cover">
                <img src="assets/play/music_deepspace.png" alt="Deepspace cover art">
                <div class="music-play-overlay">
                  <button type="button" class="music-play-btn" aria-label="Play Deepspace">
                    <svg class="play-icon" viewBox="0 0 24 24" width="22" height="22"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
                  </button>
                </div>
                <div class="music-wave-badge" aria-hidden="true">
                  <span class="bar bar-1"></span>
                  <span class="bar bar-2"></span>
                  <span class="bar bar-3"></span>
                </div>
              </div>
              <div class="music-track-meta">
                <div class="music-track-header">
                  <h3 class="music-track-title">Deepspace</h3>
                  <span class="music-track-time">1:40</span>
                </div>
                <div class="music-progress-wrapper" role="slider" aria-label="Progress for Deepspace" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                  <div class="music-progress-bar">
                    <div class="music-progress-fill"></div>
                  </div>
                </div>
              </div>
              <audio preload="metadata">
                <source src="assets/audio/deepspace.m4a" type="audio/mp4">
                <source src="assets/audio/deepspace.wav" type="audio/wav">
              </audio>
            </div>

            <!-- Track 5: You tried -->
            <div class="music-track-card" data-track-id="you-tried">
              <div class="music-track-cover">
                <img src="assets/play/music_you_tried.png" alt="You tried cover art">
                <div class="music-play-overlay">
                  <button type="button" class="music-play-btn" aria-label="Play You tried">
                    <svg class="play-icon" viewBox="0 0 24 24" width="22" height="22"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
                  </button>
                </div>
                <div class="music-wave-badge" aria-hidden="true">
                  <span class="bar bar-1"></span>
                  <span class="bar bar-2"></span>
                  <span class="bar bar-3"></span>
                </div>
              </div>
              <div class="music-track-meta">
                <div class="music-track-header">
                  <h3 class="music-track-title">You tried</h3>
                  <span class="music-track-time">0:49</span>
                </div>
                <div class="music-progress-wrapper" role="slider" aria-label="Progress for You tried" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                  <div class="music-progress-bar">
                    <div class="music-progress-fill"></div>
                  </div>
                </div>
              </div>
              <audio preload="metadata">
                <source src="assets/audio/you_tried.m4a" type="audio/mp4">
                <source src="assets/audio/you_tried.wav" type="audio/wav">
              </audio>
            </div>
          </div>
        </div>
      </section>

    </main>
    </div>
  </div>

  <!-- Persistent Floating Music Player Bar -->
  <aside class="music-dock-bar" id="music-dock-bar" aria-label="Now playing audio player" aria-hidden="true">
    <div class="dock-bar-inner">
      <div class="dock-meta">
        <div class="dock-wave-indicator" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="dock-labels">
          <span class="dock-title" id="dock-title">Title</span>
          <span class="dock-time" id="dock-time">0:00 / 0:00</span>
        </div>
      </div>
      <div class="dock-progress-box" id="dock-progress-box" role="slider" aria-label="Seek track" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0">
        <div class="dock-progress-fill" id="dock-progress-fill"></div>
      </div>
      <div class="dock-actions">
        <button type="button" class="dock-action-btn dock-play-btn" id="dock-toggle-btn" aria-label="Pause track">
          <svg class="play-icon" viewBox="0 0 24 24" width="18" height="18"><polygon points="7 4 19 12 7 20 7 4" fill="currentColor"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" fill="currentColor" rx="1"/><rect x="14" y="5" width="4" height="14" fill="currentColor" rx="1"/></svg>
        </button>
        <button type="button" class="dock-action-btn dock-close-btn" id="dock-close-btn" aria-label="Close player">
          <svg viewBox="0 0 24 24" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
